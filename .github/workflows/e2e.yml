name: E2E (vs released merod)

# Real end-to-end run against a live node. Manual (workflow_dispatch) so it does
# NOT gate PRs — booting merod is heavier and slower than the unit/mock suite,
# which already covers the full auth journey via FakeNode. The MeroKitE2ETests
# target skips itself unless MERO_E2E_NODE_URL is set.
on:
  workflow_dispatch:
    inputs:
      core_tag:
        description: 'core release to test against (default: ci/core-version)'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'  # weekly smoke, Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (single node)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Pinned, not "the newest release": this job resolved `gh release list
      # --limit 1` and so tested whatever core shipped last. core rc.17 made
      # `init --auth-mode embedded` require admin credentials, and this job went
      # red on a commit of its own that changed nothing.
      - name: Resolve the core release to test against
        env:
          CORE_TAG_INPUT: ${{ inputs.core_tag }}
        run: |
          set -euo pipefail
          set -a; . ci/core-version; set +a
          TAG="${CORE_TAG_INPUT:-$CORE_TAG}"
          echo "CORE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "core release: $TAG"

      - name: Download merod (aarch64-apple-darwin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Using core release $CORE_TAG"
          gh release download "$CORE_TAG" --repo calimero-network/core \
            --pattern 'merod_aarch64-apple-darwin.tar.gz' --output merod.tar.gz --clobber
          tar xzf merod.tar.gz
          chmod +x ./merod
          ./merod --version

      # core rc.17 (core#3276/#3277) moved admin provisioning to `init`: there is
      # no first-login bootstrap secret any more, and `--auth-mode embedded`
      # REFUSES to init without credentials. `--auth-storage persistent` is
      # required for the init-time admin to survive into `run`.
      - name: Boot merod (embedded auth, single node)
        run: |
          set -euo pipefail
          printf 'dev-password' | ./merod --home ./e2e-node --node e2e init \
            --server-port 4001 --swarm-port 4002 \
            --auth-mode embedded --auth-storage persistent \
            --admin-user dev --admin-password-stdin
          ./merod --home ./e2e-node --node e2e run > merod.log 2>&1 &
          echo $! > merod.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/admin-api/health >/dev/null 2>&1 && { echo "merod healthy"; break; }
            sleep 2
            [ "$i" = "30" ] && { echo "merod did not become healthy"; cat merod.log; exit 1; }
          done

      - name: Run e2e tests
        env:
          MERO_E2E_NODE_URL: http://localhost:4001
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
        run: |
          set -o pipefail
          swift test --filter MeroKitE2ETests 2>&1 | tee e2e.log
          # Guard against a vacuous/all-skipped green: require a real pass.
          grep -qE "Executed [1-9][0-9]* test" e2e.log \
            || { echo "::error::e2e produced no executed tests — refusing a vacuous pass"; exit 1; }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e.log
            merod.log
          if-no-files-found: warn

      - name: Stop merod
        if: always()
        run: kill "$(cat merod.pid 2>/dev/null)" 2>/dev/null || true
