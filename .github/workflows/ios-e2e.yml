name: iOS E2E (vs live merod)

# End-to-end iOS tests against a REAL merod node + registry (heavier than the
# mock XCUITest in ui.yml, so this runs on master pushes / manually / weekly,
# not on every PR). Two jobs:
#   * single-node — full-feature AppE2ETests (login → explorer → chat).
#   * multi-node  — two nodes + two simulators, cross-user chat (ChatMultiUserTests),
#     driven by chat-multi-e2e.sh. Allowed to fail: cross-node gossipsub between
#     two co-located merods is unreliable on a single host, so this job is
#     informational until that (core-side) settles.
on:
  workflow_dispatch:
    inputs:
      core_tag:
        description: 'core release to test against (default: ci/core-version)'
        required: false
        default: ''
  push:
    branches:
      - master
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC

permissions:
  contents: read

jobs:
  single-node-e2e:
    name: Full-feature e2e (1 node)
    runs-on: macos-15
    # A healthy run is ~6 minutes. See the note on the chat job for why the
    # STEP timeout below is the one that matters.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen

      # Pinned to ci/core-version, not "the newest release": resolving the
      # latest tag meant a core release could change what this job tests with no
      # commit here, and that is how it silently moved from rc.24 to rc.25.
      - name: Resolve the core release to test against
        env:
          CORE_TAG_INPUT: ${{ inputs.core_tag }}
        run: |
          set -euo pipefail
          set -a; . ci/core-version; set +a
          TAG="${CORE_TAG_INPUT:-$CORE_TAG}"
          echo "CORE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "core release: $TAG"

      - name: Download merod (aarch64-apple-darwin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release download "$CORE_TAG" --repo calimero-network/core \
            --pattern 'merod_aarch64-apple-darwin.tar.gz' --output merod.tar.gz --clobber
          tar xzf merod.tar.gz
          chmod +x ./merod
          sudo mv ./merod /usr/local/bin/merod
          merod --version

      - name: Run AppE2ETests (boots node + sim)
        # Tighter than the job timeout so a hang FAILS the step and still lets
        # the log upload run — see the note on the chat job.
        timeout-minutes: 15
        run: ./e2e-ios.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-single-node
          path: |
            .e2e-ios.log
            .mero-e2e-node.log
          if-no-files-found: warn
          include-hidden-files: true

  multi-node-e2e:
    name: Multi-user chat e2e (2 nodes / 2 sims)
    runs-on: macos-15
    # ⚠️ Was 75, and that is exactly what it cost: on 2026-09-09 this job hung
    # three times in a row and burned 75 minutes of a macOS runner (billed 10x)
    # each time — ~2,250 Linux-equivalent minutes in an afternoon. The real work
    # had stopped 3 minutes in; the rest was `simctl bootstatus` blocking on a
    # simulator that never booted.
    #
    # The script now bounds that wait itself (`with_timeout` in
    # chat-multi-e2e.sh), so this is the outer guard for anything else that
    # hangs. Prefer the STEP timeout below: a step timeout still runs the
    # `if: always()` log upload, a job timeout cancels it and you lose the
    # evidence — which is how the first two of those three runs told us nothing.
    #
    # The original reason for the headroom still stands (a CANCELLED job is not
    # absorbed by continue-on-error, a clean failure is), which is why the step
    # timeout is deliberately tighter than the job timeout.
    timeout-minutes: 35
    # Informational: cross-node sync between co-located merods is flaky on one host.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen

      # Pinned to ci/core-version, not "the newest release": resolving the
      # latest tag meant a core release could change what this job tests with no
      # commit here, and that is how it silently moved from rc.24 to rc.25.
      - name: Resolve the core release to test against
        env:
          CORE_TAG_INPUT: ${{ inputs.core_tag }}
        run: |
          set -euo pipefail
          set -a; . ci/core-version; set +a
          TAG="${CORE_TAG_INPUT:-$CORE_TAG}"
          echo "CORE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "core release: $TAG"

      - name: Download merod (aarch64-apple-darwin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release download "$CORE_TAG" --repo calimero-network/core \
            --pattern 'merod_aarch64-apple-darwin.tar.gz' --output merod.tar.gz --clobber
          tar xzf merod.tar.gz
          chmod +x ./merod
          sudo mv ./merod /usr/local/bin/merod
          merod --version

      - name: Run chat-multi-e2e.sh (2 nodes, 2 sims)
        # Tighter than the job timeout on purpose, so this FAILS (and the logs
        # upload) instead of the job being CANCELLED.
        timeout-minutes: 25
        run: ./chat-multi-e2e.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-multi-node
          path: |
            .mero-a.log
            .mero-b.log
            .mero-role-*.log
          if-no-files-found: warn
          include-hidden-files: true
