name: Merobox Chat Sync (curb)

# The chat-app analog of merobox-sync.yml: instead of kv_store, it exercises the
# REAL published mero-chat app (com.calimero.curb, downloaded from
# apps.calimero.network) that the iOS sample installs — meshing a curb "Channel"
# context across two Docker nodes, sending a message on node 1, and asserting it
# replicates to node 2. This proves mero-chat cross-node message sync works
# without the flaky iOS simulator path.
#
# PROVEN: on first CI run, curb 7.0.10 synced a message node 1 -> node 2 in
# ~1.2s and node 2 read it back — mero-chat cross-node sync works on a live node.
# Kept INFORMATIONAL (continue-on-error) anyway because it still depends on an
# external moving part — the apps.calimero.network download — so a registry
# outage shouldn't redden master. The node image itself is now pinned to
# ci/core-version rather than tracking `edge`. The self-contained kv_store sync check (merobox-sync.yml) is the
# gating signal; this one is the real-app proof.
#
# ⚠️ CURRENTLY CANNOT PASS. `com.calimero.curb` is no longer published on
# apps.calimero.network — the registry answers `[]` for it, and mero-chat was
# abandoned on 2026-08-19. What is there now is `com.calimero.chat` 3.1.1
# ("Mero Chat v2 — group-based context management"), a different contract with a
# different model, so the call shapes in chat-sync-two-node.yml do not apply to
# it. Pointing this at that package is a port, not a rename.
#
# So it is now DISPATCH-ONLY. It used to run on every master push and on PRs
# touching the harness, where it burned ~2.5 minutes to report an opaque
# `IndexError: list index out of range` from the version lookup, and showed as a
# red check on PRs that had nothing to do with it. A check that cannot pass
# should not be on the board: it now says why it stopped when someone asks for
# it, and stays out of the way until the port lands. The gating cross-node
# signal is merobox-sync.yml, which depends on no published app.
on:
  workflow_dispatch:
    inputs:
      merod_image:
        description: 'merod Docker image (default: ci/core-version)'
        required: false
        default: ''
      curb_version:
        description: 'curb version to test (default: latest on the registry)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chat-sync:
    name: Two-node curb message sync
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Informational until proven green on CI (real published app vs moving edge).
    continue-on-error: true
    env:
      MEROD_IMAGE_INPUT: ${{ github.event.inputs.merod_image }}
      REGISTRY: https://apps.calimero.network
      PACKAGE: com.calimero.curb
      CURB_VERSION: ${{ github.event.inputs.curb_version }}
      WF: ci/merobox/chat-sync-two-node.yml
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve the merod image
        run: |
          set -euo pipefail
          set -a; . ci/core-version; set +a
          echo "MEROD_IMAGE=${MEROD_IMAGE_INPUT:-$MEROD_IMAGE}" >> "$GITHUB_ENV"
          echo "merod image: ${MEROD_IMAGE_INPUT:-$MEROD_IMAGE}"

      # calimero-client-py 0.6.37 ships an sdist ONLY (0.7.0 is the first with a
      # wheel), so every uncached job compiles a Rust wheel — ~70-90s measured.
      # Pinning to 0.6.37 makes that cost permanent until merobox catches up, so
      # cache it: verified elsewhere at 69.6s cold to 0.23s warm.
      - name: Cache the pip wheel build
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-merobox-0.6.74-clientpy-0.6.37-${{ runner.os }}

      # BOTH pinned, exactly. `merobox>=0.6.69` pins NOTHING: merobox declares
      # `calimero-client-py>=0.6.37`, so pip is free to take a newer one — and
      # client-py 0.7.0 (published 2026-09-02 11:46 UTC) dropped the `metadata`
      # kwarg that merobox 0.6.74 still passes to `install_dev_application`.
      # This job passed twice on 0.6.74 + 0.6.37 at 09:30 and 09:41, then failed
      # on the merge commit at 12:46 with `TypeError: got an unexpected keyword
      # argument 'metadata'` — same merobox, same node image, same wasm. Only the
      # transitive dep moved.
      #
      # 0.6.37 is not "the newest that works": it is the newest that existed when
      # merobox 0.6.74 was built (0.6.74 shipped 09:04, 0.6.38 at 11:26), which is
      # the pairing rule that keeps holding. Bump them together, never one alone.
      - name: Install merobox
        run: |
          python -m pip install --upgrade pip
          pip install 'merobox==0.6.74' 'calimero-client-py==0.6.37'
          merobox --version

      # Download the published curb bundle (.mpk = gzip tar of app.wasm + manifest)
      # and extract the wasm to the path the workflow references. Resolve the
      # latest version from the registry unless one was given.
      - name: Download curb app.wasm from the registry
        run: |
          set -euo pipefail
          VER="${CURB_VERSION}"
          if [ -z "$VER" ]; then
            # Resolve the newest published version. An UNPUBLISHED package is the
            # expected failure here, not an exceptional one, so say so rather
            # than letting `[0]` raise IndexError three lines from the cause.
            VER=$(curl -sfL "${REGISTRY}/api/v2/bundles?package=${PACKAGE}" \
              | python3 -c "import sys,json; b=json.load(sys.stdin); v=sorted([x['appVersion'] for x in (b if isinstance(b,list) else b.get('data',b))], reverse=True); print(v[0] if v else '')")
          fi
          if [ -z "$VER" ]; then
            {
              echo "## ${PACKAGE} is not published"
              echo ""
              echo "\`${REGISTRY}\` has no versions of \`${PACKAGE}\`, so there is"
              echo "nothing for this check to install. mero-chat was abandoned on"
              echo "2026-08-19; the registry now serves \`com.calimero.chat\` instead,"
              echo "which is a different contract with a different model."
              echo ""
              echo "Porting this scenario (and the iOS sample app's chat feature) to"
              echo "that package is real work, not a rename."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${PACKAGE} is no longer published on ${REGISTRY} — this check cannot run until it is ported to com.calimero.chat"
            exit 1
          fi
          echo "curb version: $VER"
          echo "CURB_RESOLVED=$VER" >> "$GITHUB_ENV"
          curl -sfL "${REGISTRY}/artifacts/${PACKAGE}/${VER}/${PACKAGE}-${VER}.mpk" -o curb.mpk
          mkdir -p extract ci/merobox/res
          tar xzf curb.mpk -C extract
          cp "$(find extract -name '*.wasm' | head -1)" ci/merobox/res/curb-app.wasm
          ls -la ci/merobox/res/curb-app.wasm
          file ci/merobox/res/curb-app.wasm

      - name: Pull merod image
        run: docker pull "$MEROD_IMAGE"

      # Matches the `image:` line by shape rather than by its current value, so
      # pinning the checked-in default does not silently stop this applying.
      - name: Pin node image in workflow
        run: |
          set -euo pipefail
          sed -i -E "s#^([[:space:]]*image:).*#\1 ${MEROD_IMAGE}#" "$WF"
          grep 'image:' "$WF"

      - name: Validate workflow
        run: merobox bootstrap validate "$WF"

      - name: Run curb message-sync check
        run: |
          set -o pipefail
          merobox bootstrap run "$WF" 2>&1 | tee merobox-run.log

      - name: Summarize result
        if: always()
        run: |
          {
            echo "## curb (mero-chat ${CURB_RESOLVED:-?}) two-node message sync"
            if grep -q "Sync verification failed" merobox-run.log 2>/dev/null; then
              echo ":warning: **Context state did NOT converge** — final per-node state below."
              echo ""; echo '```'
              sed -n '/Final state:/,/failed/p' merobox-run.log | head -30
              echo '```'
            elif grep -qE "All assertions passed|Workflow completed successfully" merobox-run.log 2>/dev/null; then
              echo ":white_check_mark: node 2 read back node 1's chat message — mero-chat sync works."
            else
              echo "See job log — no clear pass/fail marker found (curb init or contract-arg issue?)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Node logs on failure
        if: always()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep -i calimero || true); do
            echo "::group::docker logs $c"
            docker logs "$c" 2>&1 | tail -200 || true
            echo "::endgroup::"
          done

      - name: Tear down nodes
        if: always()
        run: |
          merobox stop --all 2>/dev/null || true
          merobox nuke -f 2>/dev/null || true
