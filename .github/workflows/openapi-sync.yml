name: OpenAPI sync

# Keeps openapi/openapi.json, Sources/MeroAPI/Generated and the facade
# (Sources/MeroKit/Api/Generated/Facade.swift) in step with core's OpenAPI
# document. core's openapi-sync.yml sends `core-openapi` with the commit
# whose document changed; a weekly run catches a missed event. When the
# regenerated sources differ, a pull request on the machine-owned branch
# chore/core-openapi is opened (or refreshed) as the GitHub App, so CI runs on
# it (a pull request made with GITHUB_TOKEN would not trigger CI).
#
# The sync is core's reusable sdk-openapi-sync.yml, the one all four SDKs call,
# pinned by commit below (the classifier it runs is read from core at that same
# commit). It titles the pull request by what the change does to callers, which
# semantic-release reads: `feat(api)!:` with a `BREAKING-CHANGE:` footer
# (major), `feat(api):` (minor) or `chore(api):` (patch). A facade method that
# the `summary` below finds removed or changed makes it breaking too.
#
# Needs the organization's GitHub App installed on this repository, and its
# credentials: the org-shared `vars.ACTIONS_APP_ID` and
# `secrets.ACTIONS_APP_PRIVATE_KEY`, both shared with this repository.
on:
  repository_dispatch:
    types: [core-openapi]
  workflow_dispatch:
    inputs:
      ref:
        description: 'A core branch, tag or full commit to sync to'
        required: false
        default: master
      dry_run:
        description: 'Regenerate and report, but open no pull request'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: openapi-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    uses: calimero-network/core/.github/workflows/sdk-openapi-sync.yml@8f64c76feca4b327e5874c9aaf7291679d14f587
    with:
      ref: ${{ inputs.ref }}
      dry-run: ${{ inputs.dry_run == true }}
      # The runner CI's `generated` job uses: the generator is built from source
      # with the Swift toolchain there (scripts/generate-openapi.sh), so the
      # output is byte for byte what that job checks.
      runs-on: macos-15
      timeout-minutes: 45
      generate: scripts/generate-openapi.sh refresh "$CORE_TARGET"
      vendor-path: openapi/openapi.json
      source-file: openapi/source
      source-key: CORE_COMMIT
      owned-paths: openapi Sources/MeroAPI/Generated Sources/MeroKit/Api/Generated
      # The facade methods added, removed or changed. Exit 3 (a method removed or
      # its signature changed) makes the sync breaking. Inline, since the sync
      # runs the default branch's copy of this file.
      summary: |
        python3 - "$SYNC_BEFORE/Sources/MeroKit/Api/Generated/Facade.swift" \
          Sources/MeroKit/Api/Generated/Facade.swift <<'PY'
        import re
        import sys


        def methods(path):
            """`group.name` -> the method's declaration, one line."""
            out, group = {}, None
            try:
                lines = open(path, encoding="utf-8").readlines()
            except FileNotFoundError:
                return out
            for line in lines:
                m = re.match(r"    public nonisolated var (\w+):", line)
                if m:
                    group = m.group(1)
                m = re.match(r"        public func (`?\w+`?)\((.*)\) async throws(.*?) \{$", line)
                if m and group:
                    out[f"{group}.{m.group(1)}"] = f"{group}.{m.group(1)}({m.group(2)}){m.group(3)}".rstrip()
            return out


        def block(title, keys, show):
            print(f"**{title}** ({len(keys)})")
            print()
            if not keys:
                print("None.")
            for k in keys:
                print(f"- `{show(k)}`")
            print()


        def main(before_path, after_path):
            before, after = methods(before_path), methods(after_path)
            added = sorted(set(after) - set(before))
            removed = sorted(set(before) - set(after))
            changed = sorted(k for k in set(before) & set(after) if before[k] != after[k])

            block("Added", added, lambda k: after[k])
            block("Removed", removed, lambda k: before[k])
            print(f"**Signature changed** ({len(changed)})")
            print()
            if not changed:
                print("None.")
            for k in changed:
                print(f"- `{k}`")
                print(f"  - before: `{before[k]}`")
                print(f"  - after: `{after[k]}`")
            print()
            if removed or changed:
                print("> A removed or renamed facade method, or a changed signature, breaks callers: "
                      "release this with a **major** version bump.")
                return 3
            print("> No facade method was removed or changed: a minor (or patch) release.")
            return 0


        sys.exit(main(sys.argv[1], sys.argv[2]))
        PY
      summary-title: Facade changes
      app-id: ${{ vars.ACTIONS_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
