name: OpenAPI sync

# Keeps openapi/openapi.json, Sources/MeroAPI/Generated and the facade
# (Sources/MeroKit/Api/Generated/Facade.swift) in step with core's OpenAPI
# document. core's openapi-sync.yml sends `core-openapi` with the commit
# whose document changed; a weekly run catches a missed event. When the
# regenerated sources differ, a pull request on the machine-owned branch
# chore/core-openapi is opened (or refreshed) as the GitHub App, so CI runs on
# it (a pull request made with GITHUB_TOKEN would not trigger CI).
#
# The sync is core's reusable sdk-openapi-sync.yml, the one all four SDKs call,
# pinned by commit below (the classifier it runs is read from core at that same
# commit). It titles the pull request by what the change does to callers, which
# semantic-release reads: `feat(api)!:` with a `BREAKING-CHANGE:` footer
# (major), `feat(api):` (minor) or `chore(api):` (patch). A facade method that
# scripts/facade-diff.py finds removed or changed makes it breaking too.
#
# Needs the organization's GitHub App installed on this repository, and its
# credentials: the org-shared `vars.ACTIONS_APP_ID` and
# `secrets.ACTIONS_APP_PRIVATE_KEY`, both shared with this repository.
on:
  repository_dispatch:
    types: [core-openapi]
  workflow_dispatch:
    inputs:
      ref:
        description: 'A core branch, tag or full commit to sync to'
        required: false
        default: master
      dry_run:
        description: 'Regenerate and report, but open no pull request'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: openapi-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    uses: calimero-network/core/.github/workflows/sdk-openapi-sync.yml@8a5beaaaa06515fa3b568136388a2ddb9d6eea70
    with:
      ref: ${{ inputs.ref }}
      dry-run: ${{ inputs.dry_run == true }}
      # The runner CI's `generated` job uses: the generator is built from source
      # with the Swift toolchain there (scripts/generate-openapi.sh), so the
      # output is byte for byte what that job checks.
      runs-on: macos-15
      timeout-minutes: 45
      generate: scripts/generate-openapi.sh refresh "$CORE_TARGET"
      vendor-path: openapi/openapi.json
      source-file: openapi/source
      source-key: CORE_COMMIT
      owned-paths: openapi Sources/MeroAPI/Generated Sources/MeroKit/Api/Generated
      summary: python3 scripts/facade-diff.py "$SYNC_BEFORE/Sources/MeroKit/Api/Generated/Facade.swift" Sources/MeroKit/Api/Generated/Facade.swift
      summary-title: Facade changes
      app-id: ${{ vars.ACTIONS_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
