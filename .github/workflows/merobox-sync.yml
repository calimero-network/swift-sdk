name: Merobox Sync (2 nodes)

# Backend/protocol-level sync checks: boot two real merod nodes in Docker via
# merobox, mesh a shared kv_store context across them, and assert writes
# replicate across nodes AND the context state hash converges (i.e. actually
# initializes — not the all-ones "uninitialized" hash). Two scenarios:
#   * sync-two-node.yml       — node 1 -> node 2
#   * sync-two-node-bidi.yml  — node 1 -> node 2 AND node 2 -> node 1
# This is the node + WASM + sync signal underneath the iOS chat e2e, isolated
# from the curb app and the simulator.
#
# Docker-based, so it runs on ubuntu (the macOS runners the iOS suites use have
# no Docker). Not a blanket PR gate, so it runs on master pushes / weekly / on
# demand, plus PRs that touch the merobox harness itself.
#
# The node image is PINNED to ci/core-version. It used to track `edge`, which is
# how core rc.26 ("leave mDNS off unless asked for") reddened this job on a
# commit of its own that changed nothing: the two containers stopped finding
# each other and the failure surfaced three layers away as `join_namespace`
# HTTP 500. The scenarios now ask for multicast explicitly (`nodes.mdns: true`).
#
# GATING: cross-node sync converges reliably (sub-second) once the kv_store wasm
# matches the node — see ci/merobox/README.md. A red run here means a genuine
# regression (upstream node sync broke, or the vendored wasm drifted from the
# node image), which we want surfaced. The always-on node-log + peer-connectivity
# dump is kept to make such a failure quick to triage ("nodes never peered" vs
# "peered but state didn't sync").
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'ci/merobox/**'
      - '.github/workflows/merobox-sync.yml'
  workflow_dispatch:
    inputs:
      merod_image:
        description: 'merod Docker image (default: ci/core-version)'
        required: false
        default: ''
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - sync-two-node.yml
          - sync-two-node-bidi.yml
    env:
      MEROD_IMAGE_INPUT: ${{ github.event.inputs.merod_image }}
      WF: ci/merobox/${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve the merod image
        run: |
          set -euo pipefail
          set -a; . ci/core-version; set +a
          echo "MEROD_IMAGE=${MEROD_IMAGE_INPUT:-$MEROD_IMAGE}" >> "$GITHUB_ENV"
          echo "CORE_TAG=$CORE_TAG" >> "$GITHUB_ENV"
          echo "merod image: ${MEROD_IMAGE_INPUT:-$MEROD_IMAGE}  (core $CORE_TAG)"

      # calimero-client-py 0.6.37 ships an sdist ONLY (0.7.0 is the first with a
      # wheel), so every uncached job compiles a Rust wheel — ~70-90s measured.
      # Pinning to 0.6.37 makes that cost permanent until merobox catches up, so
      # cache it: verified elsewhere at 69.6s cold to 0.23s warm.
      - name: Cache the pip wheel build
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-merobox-0.6.74-clientpy-0.6.37-${{ runner.os }}

      # BOTH pinned, exactly. `merobox>=0.6.69` pins NOTHING: merobox declares
      # `calimero-client-py>=0.6.37`, so pip is free to take a newer one — and
      # client-py 0.7.0 (published 2026-09-02 11:46 UTC) dropped the `metadata`
      # kwarg that merobox 0.6.74 still passes to `install_dev_application`.
      # This job passed twice on 0.6.74 + 0.6.37 at 09:30 and 09:41, then failed
      # on the merge commit at 12:46 with `TypeError: got an unexpected keyword
      # argument 'metadata'` — same merobox, same node image, same wasm. Only the
      # transitive dep moved.
      #
      # 0.6.37 is not "the newest that works": it is the newest that existed when
      # merobox 0.6.74 was built (0.6.74 shipped 09:04, 0.6.38 at 11:26), which is
      # the pairing rule that keeps holding. Bump them together, never one alone.
      - name: Install merobox
        run: |
          python -m pip install --upgrade pip
          pip install 'merobox==0.6.74' 'calimero-client-py==0.6.37'
          merobox --version

      - name: Pull merod image
        run: docker pull "$MEROD_IMAGE"

      # The wasm must match the node's host ABI or the joining node can never
      # initialize the context and sits on the all-ones "uninitialized" hash
      # forever — which reads as a sync bug, not a fixture bug. This used to be
      # a binary vendored into the repo and rebuilt by hand after a core bump;
      # it went 10 release candidates stale. core publishes a version-matched
      # `kv-store-test-fixture.mpk` (a gzip tar of manifest.json + app.wasm +
      # abi.json) on every release, so take it from the pinned tag instead.
      - name: Download the version-matched kv_store wasm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CORE_TAG" --repo calimero-network/core \
            --pattern 'kv-store-test-fixture.mpk' --output kv-store.mpk --clobber
          mkdir -p kv-store-fixture ci/merobox/res
          tar xzf kv-store.mpk -C kv-store-fixture
          cp kv-store-fixture/app.wasm ci/merobox/res/kv_store.wasm
          python3 -c "import json;m=json.load(open('kv-store-fixture/manifest.json'));print('kv_store fixture appVersion:', m['appVersion'])"
          ls -l ci/merobox/res/kv_store.wasm

      # Point the scenario at the resolved image without editing the checked-in
      # YAML. Matches the `image:` line by shape rather than by its current
      # value, so pinning the checked-in default does not silently stop this
      # substitution from applying.
      - name: Pin node image in workflow
        run: |
          set -euo pipefail
          sed -i -E "s#^([[:space:]]*image:).*#\1 ${MEROD_IMAGE}#" "$WF"
          grep 'image:' "$WF"

      - name: Validate workflow
        run: merobox bootstrap validate "$WF"

      - name: Run sync check
        run: |
          set -o pipefail
          merobox bootstrap run "$WF" 2>&1 | tee merobox-run.log

      - name: Summarize result
        if: always()
        run: |
          {
            echo "## ${{ matrix.scenario }}"
            if grep -q "Sync verification failed" merobox-run.log 2>/dev/null; then
              echo ":warning: **Context state did NOT converge** — the known cross-node"
              echo "sync issue (a node stuck on the all-ones uninitialized hash). This job"
              echo "is informational; final per-node state below."
              echo ""
              echo '```'
              sed -n '/Final state:/,/failed/p' merobox-run.log | head -30
              echo '```'
            elif grep -qE "All assertions passed|Workflow completed successfully" merobox-run.log 2>/dev/null; then
              echo ":white_check_mark: Sync converged and the write(s) replicated across nodes."
            else
              echo "See job log — no clear pass/fail marker found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always capture node logs + connectivity so a failure can be diagnosed as
      # "nodes never peered" (discovery/networking) vs "peered but state didn't
      # sync" (the sync path itself). Best-effort greps — never fail the step.
      - name: Node logs + connectivity
        if: always()
        run: |
          {
            echo "### Peer connectivity (best-effort grep of node logs)"
            echo '```'
            for c in $(docker ps -a --format '{{.Names}}' | grep -i calimero || true); do
              hits=$(docker logs "$c" 2>&1 | grep -icE "connection established|peer connected|dial success|mdns|kad|identified peer" || true)
              echo "$c: $hits peer/discovery log line(s)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for c in $(docker ps -a --format '{{.Names}}' | grep -i calimero || true); do
            echo "::group::docker logs $c"
            docker logs "$c" 2>&1 | tail -200 || true
            echo "::endgroup::"
          done

      - name: Tear down nodes
        if: always()
        run: |
          merobox stop --all 2>/dev/null || true
          merobox nuke -f 2>/dev/null || true
