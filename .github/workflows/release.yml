name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Build and test with a read-only token: this job runs the package's own code,
  # so it gets nothing it could publish with.
  verify:
    name: Verify SPM Release
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

  # SwiftPM consumes tags directly — no artifact upload is required. This job
  # gates the tag on a green build/test and cuts a GitHub Release for it. It is
  # the only one holding contents: write, and it runs nothing but the release.
  release:
    name: Publish SPM Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
