name: UI Tests

# XCUITest (the Swift analog of Playwright): builds the SwiftUI sample app and
# drives login → home → RPC → logout in the iOS Simulator against an in-app mock.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    name: XCUITest (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # generate-ios.sh rewrites this key to the developer's Mac LAN IP for a
      # physical-device install, and one such run got committed. Nothing failed
      # here — `ui.yml` runs against the in-app mock, which never reads it — but
      # every simulator run of the live-node suites then pointed at an address
      # that does not exist on a runner, and both iOS E2E jobs failed for five
      # weeks on "did not reach explorer". Two seconds here, in the job that
      # gates every PR, so it cannot come back.
      - name: Assert the sample app's default node URL is loopback
        working-directory: Examples/MeroSampleApp
        run: |
          set -euo pipefail
          URL=$(sed -n 's/.*DefaultNodeURL: *"\(.*\)".*/\1/p' project.yml)
          echo "DefaultNodeURL: ${URL:-<unset>}"
          case "$URL" in
            http://localhost:*|http://127.0.0.1:*) ;;
            *) echo "::error file=Examples/MeroSampleApp/project.yml::DefaultNodeURL must be a loopback URL, got '${URL:-<unset>}' — a LAN IP here points every simulator run at an address CI cannot reach (generate-ios.sh sets it for device installs and restores this file on exit)"; exit 1 ;;
          esac

      - name: Generate Xcode project
        working-directory: Examples/MeroSampleApp
        run: xcodegen generate

      - name: Run UI tests
        working-directory: Examples/MeroSampleApp
        run: |
          set -o pipefail
          # Pick an available iPhone simulator by name (image-agnostic).
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone 1[0-9][^(]*' | head -1 | xargs)
          echo "Using simulator: ${DEVICE:-iPhone 16}"
          # -retry-tests-on-failure absorbs transient runner flakes (e.g. "Timed
          # out while launching application via Xcode") without masking real
          # failures — a genuinely broken test still fails after all iterations.
          # Skip the node+registry-dependent e2e classes here (this job runs
          # against the in-app mock, no node). They run via e2e-ios.sh /
          # chat-multi-e2e.sh locally against a live merod.
          xcodebuild test \
            -project MeroSampleApp.xcodeproj \
            -scheme MeroSampleApp \
            -destination "platform=iOS Simulator,name=${DEVICE:-iPhone 16}" \
            -skip-testing:MeroSampleAppUITests/AppE2ETests \
            -skip-testing:MeroSampleAppUITests/ChatMultiUserTests \
            -retry-tests-on-failure -test-iterations 3 \
            | tee xcuitest.log
          # `-skip-testing` makes xcodebuild report "Selected tests" (not "All
          # tests"); accept either, and require the overall success marker.
          grep -qE "Test Suite '(All tests|Selected tests)' passed" xcuitest.log \
            && grep -q "\*\* TEST SUCCEEDED \*\*" xcuitest.log \
            || { echo "::error::UI tests did not pass"; exit 1; }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcuitest-log
          path: Examples/MeroSampleApp/xcuitest.log
          if-no-files-found: warn
