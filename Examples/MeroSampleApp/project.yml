# XcodeGen spec for the MeroKit sample app + its XCUITest suite.
# Generate the Xcode project with:  xcodegen generate
# Run the UI tests with:
#   xcodebuild test -project MeroSampleApp.xcodeproj -scheme MeroSampleApp \
#     -destination 'platform=iOS Simulator,name=iPhone 17'
name: MeroSampleApp

options:
  bundleIdPrefix: network.calimero.merokit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    path: ../..

targets:
  MeroSampleApp:
    type: application
    info:
      path: Sources/Generated-Info.plist
      properties:
        UILaunchScreen: {}
        DefaultNodeURL: "http://192.168.1.5:4011"
        NSLocalNetworkUsageDescription: "Connect to a Calimero node running on your Mac over the local network for development."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.merokit.sample
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  MeroSampleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.merokit.sample.uitests
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: MeroSampleApp

schemes:
  MeroSampleApp:
    build:
      targets:
        MeroSampleApp: all
        MeroSampleAppUITests: [test]
    test:
      targets:
        - MeroSampleAppUITests
