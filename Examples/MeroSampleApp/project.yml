# XcodeGen spec for the MeroKit sample app + its XCUITest suite.
# Generate the Xcode project with:  xcodegen generate
# Run the UI tests with:
#   xcodebuild test -project MeroSampleApp.xcodeproj -scheme MeroSampleApp \
#     -destination 'platform=iOS Simulator,name=iPhone 17'
name: MeroSampleApp

options:
  bundleIdPrefix: network.calimero.merokit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    path: ../..

targets:
  MeroSampleApp:
    type: application
    info:
      path: Sources/Generated-Info.plist
      properties:
        UILaunchScreen: {}
        # The node a fresh launch points at. It MUST stay a loopback URL: the
        # simulator shares the host's network, so this is the node the e2e
        # harnesses boot, and `ExplorerUI` adopts this value over the field's
        # own default on every launch. generate-ios.sh rewrites it to the Mac's
        # LAN IP for a physical-device install (a phone's "localhost" is the
        # phone) and restores this file afterwards — a committed LAN IP points
        # every simulator run at an address that does not exist, which is how
        # both iOS E2E jobs failed for five weeks with "did not reach explorer".
        DefaultNodeURL: "http://localhost:4001"
        NSLocalNetworkUsageDescription: "Connect to a Calimero node running on your Mac over the local network for development."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.merokit.sample
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  MeroSampleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.merokit.sample.uitests
        SWIFT_VERSION: "5.9"
        # A test bundle is code-signed like any other, and signing needs an
        # Info.plist. The app target gets one from its `info:` block; this one
        # has nothing to declare, so let Xcode synthesize it rather than
        # committing a file whose only purpose is to exist.
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MeroSampleApp

schemes:
  MeroSampleApp:
    build:
      targets:
        MeroSampleApp: all
        MeroSampleAppUITests: [test]
    test:
      targets:
        - MeroSampleAppUITests
