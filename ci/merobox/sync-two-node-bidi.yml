# Two-node BIDIRECTIONAL cross-node sync check.
#
# Companion to sync-two-node.yml. That one proves node 1 -> node 2. This one
# additionally proves node 2 -> node 1: after the joiner (node 2) is meshed in,
# it writes a key and node 1 must see it. Catches a sync path that only works
# from the context creator outward.
#
# Same node image and wasm handling as sync-two-node.yml: both pinned to the
# core release in ci/core-version.
#
# Run:  merobox bootstrap run ci/merobox/sync-two-node-bidi.yml   (from repo root)
name: Two-node bidirectional sync (kv_store)
description: Writes on BOTH nodes must replicate to the other; context hash converges.

nodes:
  count: 2
  # Pinned; the CI job overwrites this line from ci/core-version.
  image: ghcr.io/calimero-network/merod:0.11.0-rc.29
  prefix: calimero-node
  # core rc.26 ("leave mDNS off unless asked for", core#3620) turned multicast
  # OFF by default, and these two containers have nothing else to find each
  # other with: `bootstrap.nodes` names the public devnet boot-node, no sibling
  # addresses are wired, and merod ships no rendezvous server. Without this the
  # nodes never peer and the run fails three layers away, as `join_namespace`
  # HTTP 500 (the joiner waiting 5s for a group key only a peer could send).
  # A test fleet on one Docker bridge is exactly the case where multicast is
  # the right answer — what matters is that the choice is explicit.
  mdns: true

nuke_on_start: true
nuke_on_end: true
stop_all_nodes: true
wait_timeout: 120

steps:
  - name: Install kv_store on node 1
    type: install_application
    node: calimero-node-1
    path: ./ci/merobox/res/kv_store.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Mesh the context across node 1 + node 2
    type: create_mesh
    context_node: calimero-node-1
    application_id: "{{app_id}}"
    nodes:
      - calimero-node-2
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  # --- Direction 1: node 1 -> node 2 ---
  - name: Write forward_key on node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: set
    args:
      key: forward_key
      value: from_node_1

  - name: Wait for forward write to converge
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
    trigger_sync: true
    timeout: 90

  - name: Read forward_key on node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get
    args:
      key: forward_key
    outputs:
      forward_read: result

  # --- Direction 2: node 2 -> node 1 ---
  - name: Write backward_key on node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: set
    args:
      key: backward_key
      value: from_node_2

  - name: Wait for backward write to converge
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
    trigger_sync: true
    timeout: 90

  - name: Read backward_key on node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: get
    args:
      key: backward_key
    outputs:
      backward_read: result

  - name: Assert both directions replicated
    type: assert
    statements:
      - "contains({{forward_read}}, 'from_node_1')"
      - "contains({{backward_read}}, 'from_node_2')"
